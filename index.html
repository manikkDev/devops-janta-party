<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pradhan Resignation Doubt Button</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at center, #1b1b2f, #0f0f1a);
      color: #ffffff;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 2rem 1rem;
      gap: 1rem;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      max-width: 100%;
    }

    h1 {
      font-size: clamp(2rem, 3.6vw, 3.2rem);
      color: #ff4d4d;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      line-height: 1.05;
      white-space: nowrap;
      text-shadow: 0 0 15px rgba(255, 77, 77, 0.5);
    }

    p.subtitle {
      color: #aaaaaa;
      font-size: 1.1rem;
    }

    /* Container for the runaway button */
    .button-arena {
      position: relative;
      width: 100%;
      max-width: 1200px;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      border: 2px dashed rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.02);
      overflow: hidden;
    }

    /* 3D Flip Container */
    .doubt-btn-wrapper {
      position: absolute;
      width: 225px;
      height: 225px;
      perspective: 1000px;
      transition: top 0.25s cubic-bezier(0.25, 0.8, 0.25, 1), 
                  left 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer;
    }

    .doubt-btn-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
      border-radius: 50%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 77, 77, 0.4);
    }

    /* Class added via JavaScript on click to trigger 3D Flip */
    .doubt-btn-wrapper.flipped .doubt-btn-inner {
      transform: rotateY(180deg);
    }

    /* Front & Back Faces */
    .btn-face {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 50%;
      overflow: hidden;
      border: 5px solid #ff4d4d;
      background-color: #1e1e1e;
    }

    .btn-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .btn-face-back {
      transform: rotateY(180deg);
      border-color: #ffcc00;
    }

    /* Label overlay on images */
    .btn-overlay {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 0.9rem;
      font-weight: bold;
      padding: 4px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Click Particle Effect */
    .particle {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      animation: explode 0.6s ease-out forwards;
    }

    @keyframes explode {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(var(--dx), var(--dy)) scale(0);
        opacity: 0;
      }
    }

    @media (max-width: 800px) {
      h1 {
        white-space: normal;
        font-size: clamp(1.7rem, 8vw, 2.4rem);
      }

      .button-arena {
        flex: 1 1 auto;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>The Dharmendra Pradhan Resignation Button</h1>
    <p class="subtitle">Press to demand accountability (if Pradhan lets you).</p>
  </header>

  <div class="button-arena" id="arena">
    <div class="doubt-btn-wrapper" id="doubtBtn">
      <div class="doubt-btn-inner">
        <!-- Front Side: Dharmendra -->
        <div class="btn-face btn-face-front">
          <img src="Images/dharmendra.png" alt="Dharmendra">
          <div class="btn-overlay">RESIGN?</div>
        </div>
        <!-- Back Side: Modi -->
        <div class="btn-face btn-face-back">
          <img src="Images/modi.png" alt="Modi">
          <div class="btn-overlay">EVADED!</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const btn = document.getElementById('doubtBtn');
    const arena = document.getElementById('arena');
    let isFlipped = false;

    // --- 1. RUNAWAY MECHANISM ---
    btn.addEventListener('mouseover', moveButton);
    document.addEventListener('mousemove', avoidCursor);

    function avoidCursor(event) {
      const btnRect = btn.getBoundingClientRect();
      const cursorX = event.clientX;
      const cursorY = event.clientY;
      const centerX = btnRect.left + btnRect.width / 2;
      const centerY = btnRect.top + btnRect.height / 2;
      const distance = Math.hypot(cursorX - centerX, cursorY - centerY);

      if (distance < 180) {
        moveButton();
      }
    }

    function moveButton() {
      const arenaRect = arena.getBoundingClientRect();
      const btnRect = btn.getBoundingClientRect();

      const maxX = arenaRect.width - btnRect.width;
      const maxY = arenaRect.height - btnRect.height;

      const randomX = Math.floor(Math.random() * Math.max(maxX, 1));
      const randomY = Math.floor(Math.random() * Math.max(maxY, 1));

      btn.style.left = `${randomX}px`;
      btn.style.top = `${randomY}px`;
    }

    // Initialize random starting position inside the container
    moveButton();

    // --- 2. AUDIO GENERATOR (Sad Trombone Effect) ---
    function playSadTrombone() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      const notes = [
        { freq: 311.13, duration: 0.25 }, // Eb4
        { freq: 293.66, duration: 0.25 }, // D4
        { freq: 277.18, duration: 0.25 }, // Db4
        { freq: 261.63, duration: 0.7 }   // C4 
      ];

      let startTime = audioCtx.currentTime;

      notes.forEach((note, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(note.freq, startTime);

        if (index === notes.length - 1) {
          osc.frequency.linearRampToValueAtTime(note.freq - 30, startTime + note.duration);
        }

        gain.gain.setValueAtTime(0.2, startTime);
        gain.gain.exponentialRampToValueAtTime(0.01, startTime + note.duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(startTime);
        osc.stop(startTime + note.duration);

        startTime += note.duration;
      });
    }

    // --- 3. PARTICLE EXPLOSION EFFECT ---
    function createParticles(x, y) {
      const colors = ['#ff4d4d', '#ffcc00', '#ffffff', '#ff8000'];
      for (let i = 0; i < 20; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        const size = Math.random() * 8 + 4;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        
        const destinationX = (Math.random() - 0.5) * 200;
        const destinationY = (Math.random() - 0.5) * 200;
        
        particle.style.setProperty('--dx', `${destinationX}px`);
        particle.style.setProperty('--dy', `${destinationY}px`);
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;

        arena.appendChild(particle);

        setTimeout(() => {
          particle.remove();
        }, 600);
      }
    }

    // --- 4. CLICK EVENT & TRANSFORMATION ---
    btn.addEventListener('click', (e) => {
      // Audio effect
      playSadTrombone();

      // Particle explosion at click location
      const rect = arena.getBoundingClientRect();
      createParticles(e.clientX - rect.left, e.clientY - rect.top);

      // Trigger Image Flip Effect
      if (!isFlipped) {
        btn.classList.add('flipped');
        isFlipped = true;

        // Revert back to Dharmendra image after a longer win animation
        setTimeout(() => {
          btn.classList.remove('flipped');
          isFlipped = false;
        }, 4000);
      }

      // Evade/Move away after click
      moveButton();
    });
  </script>
</body>
</html>
